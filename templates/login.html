<!DOCTYPE html>
<html lang="en">
<head>
	{% load static %}
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log in — Event Workshop</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
	<link rel="stylesheet" href="{% static 'css/login.css' %}">
	<style>
		body{background:#fafafa}
		.login-card{max-width:920px;margin:40px auto;display:flex;gap:30px}
		.login-left{flex:1;background-image:url('{% static "photos/front.jpeg" %}');background-size:cover;background-position:center;border-radius:8px}
		.login-right{flex:1;background:#fff;padding:28px;border:1px solid #ddd;border-radius:8px}
		.brand{font-family:'Lobster',cursive;font-size:28px;text-align:center;margin-bottom:16px}
		.small-note{font-size:14px;color:#999}
		.register-box{border:1px solid #ddd;padding:18px;margin-top:12px;text-align:center;background:#fff;border-radius:8px}
		@media(max-width:768px){.login-card{flex-direction:column}.login-left{height:220px}}
	</style>
</head>
<body>
	<div class="container">
		<div class="login-card">
			<div class="login-left d-none d-md-block"></div>
			<div class="login-right">
				<div class="brand">Event Workshop</div>
				<form method="post" action="{% url 'login_user' %}">
					{% csrf_token %}
					
					{% if error %}
						<div class="alert alert-danger alert-dismissible fade show" role="alert">
							<i class="fa-solid fa-exclamation-circle"></i> {{ error }}
							<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
						</div>
					{% endif %}

					<div class="mb-2">
						<input type="email" name="email" class="form-control" placeholder="Email address" required>
					</div>
					<div class="mb-3 pw-group">
						<input type="password" name="password" id="password-field" class="form-control" placeholder="Password" required>
					</div>
					<div class="mb-3 otp-group" style="display:none;">
						<input type="text" name="otp" id="login-otp" class="form-control" placeholder="Enter OTP (6-digit)">
					</div>
					<button class="btn btn-primary w-100">Log in</button>
				</form>

				<div class="or-divider text-center my-3">OR</div>
				<div class="text-center small-note">Log in with <i class="fa-brands fa-facebook"></i></div>
				<div class="small-note text-center mt-3">Forgot password? <a href="#">Reset</a></div>
				<div class="text-center mt-2">
					<a href="#" id="use-otp">Use OTP instead</a>
				</div>

				<div class="register-box">
					<p>Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// Toggle login OTP vs password
		document.addEventListener('DOMContentLoaded', function(){
			const useOtp = document.getElementById('use-otp');
			const otpGroup = document.querySelector('.otp-group');
			const pwGroup = document.querySelector('.pw-group');
			if(useOtp){
				useOtp.addEventListener('click', function(e){
					e.preventDefault();
					if(otpGroup.style.display === 'none'){
						otpGroup.style.display = 'block';
						pwGroup.style.display = 'none';
						useOtp.textContent = 'Use password instead';
					} else {
						otpGroup.style.display = 'none';
						pwGroup.style.display = 'block';
						useOtp.textContent = 'Use OTP instead';
					}
				});
			}
		});
	</script>
</body>
</html>
